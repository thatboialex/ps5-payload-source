name: Update payload catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "sources.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-payloads.yml"

permissions:
  contents: write

concurrency:
  group: update-payload-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update payload metadata from GitHub Releases API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_payloads.py

      - name: Validate catalog and updater
        run: python -m unittest discover -s tests -v

      - name: Commit changes when upstream changed
        shell: bash
        run: |
          if git diff --quiet -- payloads.json upstream_status.json; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads.json upstream_status.json
          git commit -m "Update payload catalog"
          git push
