name: Build Ghostcontrol payload

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ghostcontrol.yml"

permissions:
  contents: write

concurrency:
  group: build-ghostcontrol-payload
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve upstream revision
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/FardinHaque70/Ghostcontrol-PS5-USB-Controller-Patcher.git HEAD | awk '{print $1}')"
          OLD="$(python -c 'import json; print(json.load(open("self_built_sources.json"))["Ghostcontrol"]["commit"])')"
          ASSETS="$(gh release view source-built-payloads --json assets --jq '.assets[].name' 2>/dev/null || true)"
          NEED=false
          if [[ "$SHA" != "$OLD" ]] || ! grep -qx 'ghost-control-x10-ds4.elf' <<<"$ASSETS"; then NEED=true; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Install SDK
        if: steps.upstream.outputs.need == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 wget git
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /
          test -x /opt/ps5-payload-sdk/bin/prospero-clang

      - name: Build Ghostcontrol
        if: steps.upstream.outputs.need == 'true'
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          git clone https://github.com/FardinHaque70/Ghostcontrol-PS5-USB-Controller-Patcher.git upstream
          git -C upstream checkout "${{ steps.upstream.outputs.sha }}"
          make -C upstream/payload clean all
          test -f upstream/payload/ghost-control-x10-ds4.elf
          python - <<'PY'
          from pathlib import Path
          p=Path('upstream/payload/ghost-control-x10-ds4.elf')
          d=p.read_bytes()
          assert d[:4] == b'\x7fELF', 'not an ELF'
          print(p.name, len(d), 'bytes')
          PY

      - name: Publish ELF
        if: steps.upstream.outputs.need == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view source-built-payloads >/dev/null 2>&1; then
            gh release create source-built-payloads --target main --title "Source-built PS5 payloads" --notes "Automatically built from upstream source trees."
          fi
          gh release upload source-built-payloads upstream/payload/ghost-control-x10-ds4.elf --clobber

      - name: Refresh catalog
        if: steps.upstream.outputs.need == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os
          p='self_built_sources.json'
          d=json.load(open(p, encoding='utf-8'))
          d['Ghostcontrol']['commit']=os.environ['UPSTREAM_SHA']
          with open(p,'w',encoding='utf-8') as f:
            json.dump(d,f,indent=2); f.write('\n')
          PY
          python scripts/update_payloads.py
          python -m unittest discover -s tests -v

      - name: Commit catalog changes
        if: steps.upstream.outputs.need == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add self_built_sources.json payloads.json upstream_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Ghostcontrol payload"
          git pull --rebase origin main
          git push
