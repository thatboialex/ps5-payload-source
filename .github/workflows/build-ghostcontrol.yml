name: Build Ghostcontrol payload

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ghostcontrol.yml"

permissions:
  contents: write

concurrency:
  group: build-ghostcontrol-payload
  cancel-in-progress: true

jobs:
  build:
    # A source-build refresh is optional maintenance. If upstream, apt, the SDK,
    # or GitHub has a temporary problem, keep the last working ELF and avoid a
    # red workflow/failure-notification email.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Try Ghostcontrol refresh safely
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          rm -f ghostcontrol_refresh.log

          (
            set -euo pipefail

            SHA="$(git ls-remote https://github.com/FardinHaque70/Ghostcontrol-PS5-USB-Controller-Patcher.git HEAD | awk '{print $1}')"
            if [ -z "$SHA" ]; then
              echo "Could not resolve upstream Ghostcontrol HEAD."
              exit 2
            fi

            OLD="$(python -c 'import json; print(json.load(open("self_built_sources.json"))["Ghostcontrol"]["commit"])')"
            ASSETS="$(gh release view source-built-payloads --json assets --jq '.assets[].name' 2>/dev/null || true)"

            if [[ "$SHA" == "$OLD" ]] && grep -qx 'ghost-control-x10-ds4.elf' <<<"$ASSETS"; then
              echo "Ghostcontrol is already current at $SHA."
              exit 0
            fi

            echo "Building Ghostcontrol upstream $SHA (previous: ${OLD:-none})"

            sudo apt-get update
            sudo apt-get install -y build-essential clang-18 lld-18 wget git
            wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
            sudo tar xf ps5-payload-dev.tar.gz -C /
            test -x /opt/ps5-payload-sdk/bin/prospero-clang

            rm -rf upstream
            git clone https://github.com/FardinHaque70/Ghostcontrol-PS5-USB-Controller-Patcher.git upstream
            git -C upstream checkout "$SHA"
            PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk make -C upstream/payload clean all
            test -f upstream/payload/ghost-control-x10-ds4.elf

            python - <<'PY'
          from pathlib import Path
          p = Path('upstream/payload/ghost-control-x10-ds4.elf')
          data = p.read_bytes()
          if data[:4] != b'\x7fELF':
              raise SystemExit('Ghostcontrol output is not an ELF')
          print(p.name, len(data), 'bytes')
          PY

            if ! gh release view source-built-payloads >/dev/null 2>&1; then
              gh release create source-built-payloads \
                --target main \
                --title "Source-built PS5 payloads" \
                --notes "Automatically built from upstream source trees."
            fi
            gh release upload source-built-payloads upstream/payload/ghost-control-x10-ds4.elf --clobber

            UPSTREAM_SHA="$SHA" python - <<'PY'
          import json
          import os
          path = 'self_built_sources.json'
          data = json.load(open(path, encoding='utf-8'))
          data['Ghostcontrol']['commit'] = os.environ['UPSTREAM_SHA']
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add self_built_sources.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Ghostcontrol source revision"
              if ! git pull --rebase origin main; then
                git rebase --abort >/dev/null 2>&1 || true
                echo "Revision record push deferred because main changed concurrently."
                exit 0
              fi
              if ! git push origin main; then
                echo "Revision record push deferred; the next scheduled run can retry."
                exit 0
              fi
            fi

            echo "Ghostcontrol refresh completed successfully."
          ) > ghostcontrol_refresh.log 2>&1

          RC=$?
          cat ghostcontrol_refresh.log

          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Ghostcontrol refresh skipped::A transient source-build, SDK, network, or GitHub error occurred. The existing verified Ghostcontrol ELF remains in place."
          fi

          # Never make an optional scheduled refresh a red workflow.
          exit 0

      - name: Report Ghostcontrol refresh
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.refresh.outputs.ok }}" = "true" ]; then
            echo "### Ghostcontrol refresh completed safely" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Ghostcontrol kept the last known-good ELF"
              echo "The refresh hit a non-fatal problem and will retry later."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
