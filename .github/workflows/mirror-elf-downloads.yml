name: Mirror PLDMGR ELF downloads

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "payloads.json"
      - ".github/workflows/mirror-elf-downloads.yml"

permissions:
  contents: write

concurrency:
  group: mirror-pldmgr-elf-downloads
  cancel-in-progress: true

jobs:
  mirror:
    # Scheduled refreshes must never turn the whole workflow red just because an
    # upstream project temporarily disappears or GitHub has a network hiccup.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare fully verified mirror candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          rm -rf dist
          mkdir -p dist

          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import time
          import urllib.parse
          import urllib.request

          catalog = json.load(open('payloads.json', encoding='utf-8'))
          out = pathlib.Path('dist')
          sums = []
          failures = []
          mirror_base = (
              'https://github.com/thatboialex/ps5-payload-source/'
              'releases/download/pldmgr-elf-downloads/'
          )

          def download(url: str) -> bytes:
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={'User-Agent': 'ps5-payload-source-mirror/2.0'},
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          return response.read()
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(2 * (attempt + 1))
              raise last

          def validate(filename: str, data: bytes, expected: str) -> str:
              if len(data) < 4 or data[:4] != b'\x7fELF':
                  raise ValueError('downloaded file is not an ELF')
              actual = hashlib.sha256(data).hexdigest()
              if expected and actual != expected:
                  raise ValueError(
                      f'SHA-256 mismatch: expected {expected}, got {actual}'
                  )
              return actual

          for item in catalog.get('payloads', []):
              filename = item['filename']
              upstream_url = item['url']
              expected = (item.get('checksum') or '').lower()

              if not filename.lower().endswith('.elf'):
                  failures.append(f'{filename}: catalog entry is not an ELF')
                  continue

              fallback_url = mirror_base + urllib.parse.quote(filename)
              attempts = [
                  ('upstream', upstream_url),
                  ('existing verified mirror', fallback_url),
              ]

              data = None
              actual = None
              errors = []
              used = None
              for label, url in attempts:
                  try:
                      candidate = download(url)
                      digest = validate(filename, candidate, expected)
                      data = candidate
                      actual = digest
                      used = label
                      break
                  except Exception as exc:
                      errors.append(f'{label}: {type(exc).__name__}: {exc}')

              if data is None or actual is None:
                  failures.append(f"{filename}: " + ' | '.join(errors))
                  continue

              (out / filename).write_bytes(data)
              sums.append(f'{actual}  {filename}')
              print(f'OK {filename} {len(data)} bytes {actual} [{used}]')

          if failures:
              print('\nMirror candidate is incomplete; keeping the existing release unchanged.')
              for failure in failures:
                  print(f'WARN {failure}')
              raise SystemExit(2)

          (out / 'SHA256SUMS.txt').write_text(
              '\n'.join(sums) + '\n', encoding='utf-8'
          )
          print(f'Prepared {len(sums)} fully verified ELF files.')
          PY

          RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ELF mirror refresh skipped::One or more upstream files were unavailable and no checksum-matching existing mirror copy could be used. The current release was left untouched."
          fi

          # A refresh failure is non-disruptive and should not generate a red
          # workflow/failure-notification email.
          exit 0

      - name: Publish verified candidate atomically
        id: publish
        if: steps.candidate.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          TAG="pldmgr-elf-downloads"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target main \
              --title "PLDMGR ELF Downloads" \
              --notes "Verified mirror of every loadable ELF currently listed in payloads.json. Assets are refreshed automatically and validated against the catalog SHA-256 checksums before upload."
          fi

          gh release upload "$TAG" dist/*.elf dist/SHA256SUMS.txt --clobber
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ELF mirror publish skipped::GitHub rejected or interrupted the release upload. The previous release assets remain available."
            exit 0
          fi

          # Only remove stale assets after every current asset uploaded successfully.
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            if [[ "$asset" == *.elf && ! -f "dist/$asset" ]]; then
              echo "Deleting stale release asset: $asset"
              gh release delete-asset "$TAG" "$asset" --yes || true
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)

          EXPECTED=$(python - <<'PY'
          import json
          data=json.load(open('payloads.json', encoding='utf-8'))
          print(sum(1 for p in data.get('payloads', []) if p['filename'].lower().endswith('.elf')))
          PY
          )
          ACTUAL=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | endswith(".elf"))] | length' 2>/dev/null)

          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ELF mirror count check::Expected $EXPECTED ELF assets but GitHub currently reports ${ACTUAL:-unknown}. The next scheduled refresh will retry."
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "Expected ELF assets: $EXPECTED"
          echo "Release ELF assets:  $ACTUAL"

      - name: Report mirror refresh
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.candidate.outputs.ready }}" = "true" ] && [ "${{ steps.publish.outputs.ok }}" = "true" ]; then
            echo "### ELF mirror refresh succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ELF mirror kept the last known-good release"
              echo "A missing upstream asset or transient GitHub error was treated as non-fatal."
              echo "Existing verified downloads remain available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
