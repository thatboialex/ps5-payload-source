name: Mirror PLDMGR ELF downloads

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "payloads.json"
      - ".github/workflows/mirror-elf-downloads.yml"

permissions:
  contents: write

concurrency:
  group: mirror-pldmgr-elf-downloads
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify every catalog ELF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          catalog = json.load(open('payloads.json', encoding='utf-8'))
          out = pathlib.Path('dist')
          out.mkdir(exist_ok=True)
          sums = []

          token = os.environ.get('GITHUB_TOKEN', '')
          for item in catalog.get('payloads', []):
              filename = item['filename']
              url = item['url']
              expected = (item.get('checksum') or '').lower()

              if not filename.lower().endswith('.elf'):
                  raise SystemExit(f'{filename}: catalog entry is not an ELF')

              headers = {'User-Agent': 'ps5-payload-source-mirror/1.0'}
              if token and 'github.com/' in url:
                  headers['Authorization'] = f'Bearer {token}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  data = response.read()

              if len(data) < 4 or data[:4] != b'\x7fELF':
                  raise SystemExit(f'{filename}: downloaded file is not an ELF')

              actual = hashlib.sha256(data).hexdigest()
              if expected and actual != expected:
                  raise SystemExit(
                      f'{filename}: SHA-256 mismatch: expected {expected}, got {actual}'
                  )

              (out / filename).write_bytes(data)
              sums.append(f'{actual}  {filename}')
              print(f'OK {filename} {len(data)} bytes {actual}')

          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print(f'Mirrored {len(sums)} ELF files.')
          PY

      - name: Publish downloadable ELF mirror release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="pldmgr-elf-downloads"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target main \
              --title "PLDMGR ELF Downloads" \
              --notes "Verified mirror of every loadable ELF currently listed in payloads.json. Assets are refreshed automatically and validated against the catalog SHA-256 checksums before upload."
          fi

          gh release upload "$TAG" dist/*.elf dist/SHA256SUMS.txt --clobber

      - name: Verify release asset count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED=$(python - <<'PY'
          import json
          data=json.load(open('payloads.json', encoding='utf-8'))
          print(sum(1 for p in data.get('payloads', []) if p['filename'].lower().endswith('.elf')))
          PY
          )
          ACTUAL=$(gh release view pldmgr-elf-downloads --json assets --jq '[.assets[] | select(.name | endswith(".elf"))] | length')
          echo "Expected ELF assets: $EXPECTED"
          echo "Release ELF assets:  $ACTUAL"
          test "$ACTUAL" -ge "$EXPECTED"
