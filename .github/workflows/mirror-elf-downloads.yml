name: Mirror PLDMGR ELF downloads

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "payloads.json"
      - ".github/workflows/mirror-elf-downloads.yml"

permissions:
  contents: write

concurrency:
  group: mirror-pldmgr-elf-downloads
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify every catalog ELF
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          catalog = json.load(open('payloads.json', encoding='utf-8'))
          out = pathlib.Path('dist')
          out.mkdir(exist_ok=True)
          sums = []

          for item in catalog.get('payloads', []):
              filename = item['filename']
              url = item['url']
              expected = (item.get('checksum') or '').lower()

              if not filename.lower().endswith('.elf'):
                  raise SystemExit(f'{filename}: catalog entry is not an ELF')

              req = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'ps5-payload-source-mirror/1.1'},
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  data = response.read()

              if len(data) < 4 or data[:4] != b'\x7fELF':
                  raise SystemExit(f'{filename}: downloaded file is not an ELF')

              actual = hashlib.sha256(data).hexdigest()
              if expected and actual != expected:
                  raise SystemExit(
                      f'{filename}: SHA-256 mismatch: expected {expected}, got {actual}'
                  )

              (out / filename).write_bytes(data)
              sums.append(f'{actual}  {filename}')
              print(f'OK {filename} {len(data)} bytes {actual}')

          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print(f'Mirrored {len(sums)} ELF files.')
          PY

      - name: Publish downloadable ELF mirror release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="pldmgr-elf-downloads"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target main \
              --title "PLDMGR ELF Downloads" \
              --notes "Verified mirror of every loadable ELF currently listed in payloads.json. Assets are refreshed automatically and validated against the catalog SHA-256 checksums before upload."
          fi
          gh release upload "$TAG" dist/*.elf dist/SHA256SUMS.txt --clobber

      - name: Verify release asset count
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED=$(python - <<'PY'
          import json
          data=json.load(open('payloads.json', encoding='utf-8'))
          print(sum(1 for p in data.get('payloads', []) if p['filename'].lower().endswith('.elf')))
          PY
          )
          ACTUAL=$(gh release view pldmgr-elf-downloads --json assets --jq '[.assets[] | select(.name | endswith(".elf"))] | length')
          echo "Expected ELF assets: $EXPECTED"
          echo "Release ELF assets:  $ACTUAL"
          test "$ACTUAL" -ge "$EXPECTED"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Record successful mirror status
        env:
          EXPECTED: ${{ steps.verify.outputs.expected }}
          ACTUAL: ${{ steps.verify.outputs.actual }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os

          status = {
              'status': 'ok',
              'verified_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'catalog_elf_count': int(os.environ['EXPECTED']),
              'release_elf_count': int(os.environ['ACTUAL']),
              'release_tag': 'pldmgr-elf-downloads',
              'release_url': 'https://github.com/thatboialex/ps5-payload-source/releases/tag/pldmgr-elf-downloads',
          }
          with open('mirror_status.json', 'w', encoding='utf-8') as f:
              json.dump(status, f, indent=2)
              f.write('\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror_status.json
          if git diff --cached --quiet; then
            echo "Mirror status unchanged."
            exit 0
          fi
          git commit -m "Verify ELF download mirror"
          git pull --rebase origin main
          git push
