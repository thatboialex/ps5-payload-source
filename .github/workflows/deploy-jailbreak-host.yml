name: Build and deploy PS5 jailbreak host

on:
  workflow_dispatch:
  schedule:
    - cron: "51 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "jailbreak-host/**"
      - "payloads-v2.json"
      - ".github/workflows/deploy-jailbreak-host.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ps5-jailbreak-host
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out host repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, cache, validate and publish gh-pages
        id: host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          rm -f jailbreak_host_diagnostics.log jailbreak_host_result.txt

          (
            set -euo pipefail
            echo "=== Clone upstream SlopKit ==="
            rm -rf _upstream _site
            git clone --depth 1 https://github.com/jordyidk/slopkit.git _upstream
            SLOPKIT_SHA="$(git -C _upstream rev-parse HEAD)"
            export SLOPKIT_SHA
            echo "SlopKit commit: $SLOPKIT_SHA"

            echo "=== Copy full upstream host ==="
            mkdir -p _site
            cp -a _upstream/. _site/
            rm -rf _site/.git

            echo "=== Build custom host and download payloads ==="
            export SITE_DIR="$GITHUB_WORKSPACE/_site"
            python jailbreak-host/build_host.py

            echo "=== Add quota-safe PS5 offline AppCache ==="
            python jailbreak-host/add_offline_cache.py

            echo "=== Validate generated host ==="
            test -f _site/index.html
            test -f _site/slopkit/poops.html
            test -f _site/payload-menu.json
            test -f _site/cache-lite-v2.appcache
            test -f _site/.nojekyll
            python - <<'PY'
          import json
          from pathlib import Path

          source = json.load(open('payloads-v2.json', encoding='utf-8'))
          menu = json.load(open('_site/payload-menu.json', encoding='utf-8'))['payloads']
          expected = len(source.get('payloads', [])) + 1
          names = [p['name'] for p in menu]

          if len(menu) != expected:
              raise SystemExit(f'expected {expected} loadable ELFs (Payload Manager + catalog), got {len(menu)}')
          if names[0] != 'Payload Manager':
              raise SystemExit('Payload Manager is not pinned first')
          if {'fetchpkg', 'pkg_install'}.intersection(names):
              raise SystemExit('removed payload unexpectedly returned')
          if 'ProsperoPlayer' not in names or 'Ghostcontrol' not in names:
              raise SystemExit('required payload missing from generated menu')

          manager = menu[0]
          if not manager['filename'].lower().startswith('pldmgr'):
              raise SystemExit(f'unexpected Payload Manager filename: {manager["filename"]}')

          for item in menu:
              p = Path('_site/payloads') / item['filename']
              if not p.is_file() or p.read_bytes()[:4] != b'\x7fELF':
                  raise SystemExit(f'bad ELF: {p}')

          index = Path('_site/index.html').read_text(encoding='utf-8')
          page = Path('_site/slopkit/poops.html').read_text(encoding='utf-8')
          manifest_path = Path('_site/cache-lite-v2.appcache')
          manifest = manifest_path.read_text(encoding='utf-8')

          if 'manifest="cache-lite-v2.appcache"' not in index:
              raise SystemExit('root page is not attached to the quota-safe AppCache')
          if 'manifest="../cache-lite-v2.appcache"' not in page:
              raise SystemExit('SlopKit page is not attached to the quota-safe AppCache')
          if 'offline-cache-status' not in index:
              raise SystemExit('offline cache status UI is missing')
          if not manifest.startswith('CACHE MANIFEST\n'):
              raise SystemExit('invalid AppCache header')
          if 'FALLBACK:\nslopkit/poops.html slopkit/poops.html' not in manifest:
              raise SystemExit('SlopKit query fallback is missing')
          if 'Q.get("autoload")' not in page:
              raise SystemExit('autoload hook missing from SlopKit page')

          cached_payload_lines = [
              line for line in manifest.splitlines()
              if line.startswith('payloads/') and line.lower().endswith('.elf')
          ]
          expected_manager_line = f'payloads/{manager["filename"]}'
          if cached_payload_lines != [expected_manager_line]:
              raise SystemExit(
                  f'offline cache must contain only Payload Manager ELF; got {cached_payload_lines}'
              )

          # Sum actual files listed in CACHE (query aliases and ./ do not add file bytes).
          in_cache = False
          cache_bytes = 0
          for line in manifest.splitlines():
              if line == 'CACHE:':
                  in_cache = True
                  continue
              if line in {'FALLBACK:', 'NETWORK:'}:
                  in_cache = False
              if not in_cache or not line or line == './' or '?' in line:
                  continue
              p = Path('_site') / line
              if p.is_file():
                  cache_bytes += p.stat().st_size
          if cache_bytes > 4_500_000:
              raise SystemExit(f'quota-safe cache too large: {cache_bytes} bytes')

          print(
              f'Validated {len(menu)} menu ELFs; offline cache is {cache_bytes} bytes '
              f'and contains SlopKit + {manager["filename"]} only'
          )
          PY

            echo "=== Publish complete static copy to gh-pages ==="
            PUBLISH="$(mktemp -d)"
            cp -a _site/. "$PUBLISH/"
            cd "$PUBLISH"
            git init -q
            git checkout -q -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -Af
            git commit -q -m "Publish PS5 jailbreak host"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin gh-pages
            echo "=== SUCCESS ==="
          ) > jailbreak_host_diagnostics.log 2>&1

          RC=$?
          cat jailbreak_host_diagnostics.log
          echo "$RC" > jailbreak_host_result.txt
          echo "result=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Configure GitHub Pages
        if: steps.host.outputs.result == '0'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.host.outputs.result == '0'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Commit build status and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jailbreak_host_diagnostics.log jailbreak_host_result.txt
          [ -f jailbreak_host_status.json ] && git add jailbreak_host_status.json
          if git diff --cached --quiet; then
            echo "No diagnostic/status changes."
            exit 0
          fi
          git commit -m "Record jailbreak host build result"
          git pull --rebase origin main
          git push origin main

      - name: Fail job if host publication failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.host.outputs.result }}" = "0"

  deploy-pages:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out repository for status record
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record live Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          build = {}
          p = Path('jailbreak_host_status.json')
          if p.exists():
              build = json.loads(p.read_text(encoding='utf-8'))
          status = {
              'status': 'live',
              'deployed_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'page_url': os.environ['PAGE_URL'],
              'payload_count': build.get('payload_count'),
              'payload_manager_version': build.get('payload_manager_version'),
              'slopkit_commit': build.get('slopkit_commit'),
              'offline_cache': 'quota-safe-slopkit-plus-payload-manager',
              'pages_branch': 'gh-pages',
          }
          Path('jailbreak_pages_status.json').write_text(
              json.dumps(status, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jailbreak_pages_status.json
          if git diff --cached --quiet; then
            echo "Pages status unchanged."
            exit 0
          fi
          git commit -m "Record live jailbreak Pages URL"
          git pull --rebase origin main
          git push origin main
