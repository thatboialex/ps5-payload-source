name: Build and deploy PS5 jailbreak host

on:
  workflow_dispatch:
  schedule:
    - cron: "51 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "jailbreak-host/**"
      - "payloads-v2.json"
      - "sources.json"
      - ".github/workflows/deploy-jailbreak-host.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ps5-jailbreak-host
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.deploy_gate.outputs.ready }}
    steps:
      - name: Check out host repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify candidate host
        id: host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          rm -f jailbreak_host_diagnostics.log

          (
            set -euo pipefail
            echo "=== Clone upstream SlopKit ==="
            rm -rf _upstream _site
            git clone --depth 1 https://github.com/jordyidk/slopkit.git _upstream
            SLOPKIT_SHA="$(git -C _upstream rev-parse HEAD)"
            export SLOPKIT_SHA
            export UPSTREAM_DIR="$GITHUB_WORKSPACE/_upstream"
            echo "SlopKit commit: $SLOPKIT_SHA"

            echo "=== Copy full upstream host ==="
            mkdir -p _site
            cp -a _upstream/. _site/
            rm -rf _site/.git

            echo "=== Build custom outer UI and hosted payload files ==="
            export SITE_DIR="$GITHUB_WORKSPACE/_site"
            python jailbreak-host/build_host.py

            echo "=== Add offline cache around fresh original path ==="
            python jailbreak-host/add_offline_cache.py

            echo "=== Validate generated host and upstream identity ==="
            test -f _site/index.html
            test -f _site/original/index.html
            test -f _site/original/slopkit/poops.html
            test -f _site/payload-menu.json
            test -f _site/cache-original-v4.appcache
            test -f _site/.nojekyll
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          upstream = Path('_upstream')
          site = Path('_site')
          original = site / 'original'

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def assert_tree_identical(left, right, label):
              a_files = sorted(p.relative_to(left) for p in left.rglob('*') if p.is_file())
              b_files = sorted(p.relative_to(right) for p in right.rglob('*') if p.is_file())
              if a_files != b_files:
                  raise SystemExit(f'{label} file list differs from upstream')
              for sub in a_files:
                  if sha256(left / sub) != sha256(right / sub):
                      raise SystemExit(f'UPSTREAM MISMATCH: {label}/{sub}')
              print(f'Byte-identical upstream tree: {label} ({len(a_files)} files)')

          for rel in ('slopkit', 'offsets', 'ui'):
              assert_tree_identical(upstream / rel, site / rel, rel + '/')
              assert_tree_identical(upstream / rel, original / rel, 'original/' + rel + '/')

          if sha256(upstream / 'index.html') != sha256(original / 'index.html'):
              raise SystemExit('original/index.html differs from upstream')
          if sha256(upstream / 'index.html') != sha256(site / 'original-slopkit.html'):
              raise SystemExit('original-slopkit.html differs from upstream')

          source = json.load(open('payloads-v2.json', encoding='utf-8'))
          menu = json.load(open(site / 'payload-menu.json', encoding='utf-8'))['payloads']
          expected = len(source.get('payloads', [])) + 1
          names = [p['name'] for p in menu]
          if len(menu) != expected:
              raise SystemExit(f'expected {expected} hosted ELFs, got {len(menu)}')
          if names[0] != 'Payload Manager':
              raise SystemExit('Payload Manager is not pinned first')
          if {'fetchpkg', 'pkg_install'}.intersection(names):
              raise SystemExit('removed payload unexpectedly returned')
          for required in ('ProsperoPlayer', 'Ghostcontrol', 'OnionHEN'):
              if required not in names:
                  raise SystemExit(f'required payload missing from hosted catalog: {required}')

          manager = menu[0]
          for item in menu:
              p = site / 'payloads' / item['filename']
              if not p.is_file() or p.read_bytes()[:4] != b'\x7fELF':
                  raise SystemExit(f'bad hosted ELF: {p}')

          index = (site / 'index.html').read_text(encoding='utf-8')
          manifest = (site / 'cache-original-v4.appcache').read_text(encoding='utf-8')

          if 'id="run-jb"' not in index or 'href="original/index.html"' not in index:
              raise SystemExit('custom UI must enter untouched SlopKit through original/index.html')
          for app in ('ProsperoRadio', 'ProsperoTV', 'PS5 Native App Boilerplate'):
              if app not in index:
                  raise SystemExit(f'native app card missing from page: {app}')

          if 'manifest="cache-original-v4.appcache"' not in index:
              raise SystemExit('custom root page is not attached to fresh cache')
          if not manifest.startswith('CACHE MANIFEST\n'):
              raise SystemExit('invalid AppCache header')

          cached_payload_lines = [
              line for line in manifest.splitlines()
              if line.startswith('payloads/') and line.lower().endswith('.elf')
          ]
          expected_manager_line = f'payloads/{manager["filename"]}'
          if cached_payload_lines != [expected_manager_line]:
              raise SystemExit(f'offline cache must contain only Payload Manager ELF; got {cached_payload_lines}')

          print(
              f'PASS: /original/ is a byte-for-byte upstream SlopKit copy; '
              f'{len(menu)} hosted ELF files and 3 native-app cards remain outside exploit logic'
          )
          PY

            echo "=== Publish complete static copy to gh-pages ==="
            PUBLISH="$(mktemp -d)"
            cp -a _site/. "$PUBLISH/"
            cd "$PUBLISH"
            git init -q
            git checkout -q -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -Af
            git commit -q -m "Publish PS5 jailbreak host"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin gh-pages
            echo "=== SUCCESS ==="
          ) > jailbreak_host_diagnostics.log 2>&1

          RC=$?
          cat jailbreak_host_diagnostics.log

          if [ "$RC" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "### PS5 host refresh succeeded"
              echo "The candidate passed validation and the gh-pages mirror was refreshed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PS5 host refresh skipped::Candidate build or validation failed. The existing live Pages site was left untouched."
            {
              echo "### PS5 host refresh skipped"
              echo "A candidate refresh failed validation or hit a transient upstream/network problem."
              echo "The last known-good live Pages deployment remains in place."
              echo "No repository status files were modified."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # A failed refresh is non-disruptive: keep the last good site and avoid
          # marking the workflow red (which also avoids failure-notification email).
          exit 0

      - name: Upload failure diagnostics
        if: steps.host.outputs.ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jailbreak-host-diagnostics-${{ github.run_id }}
          path: jailbreak_host_diagnostics.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        id: configure_pages
        if: steps.host.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: upload_pages
        if: steps.host.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Decide whether Pages deployment is ready
        id: deploy_gate
        if: always()
        shell: bash
        run: |
          HOST="${{ steps.host.outputs.ready }}"
          CONFIGURE="${{ steps.configure_pages.outcome }}"
          UPLOAD="${{ steps.upload_pages.outcome }}"

          if [ "$HOST" = "true" ] && [ "$CONFIGURE" = "success" ] && [ "$UPLOAD" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$HOST" = "true" ]; then
            echo "::warning title=Pages deployment skipped::The host validated, but GitHub Pages artifact preparation failed. The existing live site remains unchanged."
          fi
          exit 0

  deploy-pages:
    needs: build-and-publish
    if: needs.build-and-publish.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report Pages deployment result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "### GitHub Pages deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=GitHub Pages deployment failed::The newly built candidate was not promoted. The previous live Pages deployment remains available."
            {
              echo "### GitHub Pages deployment was not promoted"
              echo "GitHub Pages returned an error, so the previous live deployment was preserved."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
