name: Build PS5 jailbreak host

on:
  workflow_dispatch:
  schedule:
    - cron: "51 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "jailbreak-host/**"
      - "payloads-v2.json"
      - ".github/workflows/deploy-jailbreak-host.yml"

permissions:
  contents: write

concurrency:
  group: ps5-jailbreak-host-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out host repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, validate and publish gh-pages
        id: host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          rm -f jailbreak_host_diagnostics.log jailbreak_host_result.txt

          (
            set -euo pipefail
            echo "=== Clone upstream SlopKit ==="
            rm -rf _upstream _site
            git clone --depth 1 https://github.com/jordyidk/slopkit.git _upstream
            SLOPKIT_SHA="$(git -C _upstream rev-parse HEAD)"
            export SLOPKIT_SHA
            echo "SlopKit commit: $SLOPKIT_SHA"

            echo "=== Copy full upstream host ==="
            mkdir -p _site
            cp -a _upstream/. _site/
            rm -rf _site/.git

            echo "=== Build custom host and download payloads ==="
            export SITE_DIR="$GITHUB_WORKSPACE/_site"
            python jailbreak-host/build_host.py

            echo "=== Validate generated host ==="
            test -f _site/index.html
            test -f _site/slopkit/poops.html
            test -f _site/payloads/pldmgr.elf
            test -f _site/payload-menu.json
            python - <<'PY'
          import json
          from pathlib import Path

          menu = json.load(open('_site/payload-menu.json', encoding='utf-8'))['payloads']
          names = [p['name'] for p in menu]
          if len(menu) != 14:
              raise SystemExit(f'expected 14 loadable ELFs (Payload Manager + 13 catalog), got {len(menu)}')
          if names[0] != 'Payload Manager':
              raise SystemExit('Payload Manager is not pinned first')
          if {'fetchpkg', 'pkg_install'}.intersection(names):
              raise SystemExit('removed payload unexpectedly returned')
          if 'ProsperoPlayer' not in names or 'Ghostcontrol' not in names:
              raise SystemExit('required payload missing from generated menu')
          for item in menu:
              p = Path('_site/payloads') / item['filename']
              if not p.is_file() or p.read_bytes()[:4] != b'\x7fELF':
                  raise SystemExit(f'bad ELF: {p}')
          page = Path('_site/slopkit/poops.html').read_text(encoding='utf-8')
          for item in menu:
              if item['filename'] not in page:
                  raise SystemExit(f'missing SlopKit menu entry: {item["filename"]}')
          print(f'Validated {len(menu)} ELF payloads')
          PY

            echo "=== Publish complete static copy to gh-pages ==="
            PUBLISH="$(mktemp -d)"
            cp -a _site/. "$PUBLISH/"
            cd "$PUBLISH"
            git init -q
            git checkout -q -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -Af
            git commit -q -m "Publish PS5 jailbreak host"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin gh-pages
            echo "=== SUCCESS ==="
          ) > jailbreak_host_diagnostics.log 2>&1

          RC=$?
          cat jailbreak_host_diagnostics.log
          echo "$RC" > jailbreak_host_result.txt
          echo "result=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit build status and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jailbreak_host_diagnostics.log jailbreak_host_result.txt
          if [ -f jailbreak_host_status.json ]; then
            git add jailbreak_host_status.json
          fi
          if git diff --cached --quiet; then
            echo "No diagnostic/status changes."
            exit 0
          fi
          git commit -m "Record jailbreak host build result"
          git pull --rebase origin main
          git push origin main

      - name: Fail job if host publication failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.host.outputs.result }}" = "0"
