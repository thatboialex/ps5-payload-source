name: Build and deploy PS5 jailbreak host

on:
  workflow_dispatch:
  schedule:
    - cron: "51 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "jailbreak-host/**"
      - "payloads-v2.json"
      - ".github/workflows/deploy-jailbreak-host.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ps5-jailbreak-host
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out host repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, verify and publish gh-pages
        id: host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          rm -f jailbreak_host_diagnostics.log jailbreak_host_result.txt

          (
            set -euo pipefail
            echo "=== Clone upstream SlopKit ==="
            rm -rf _upstream _site
            git clone --depth 1 https://github.com/jordyidk/slopkit.git _upstream
            SLOPKIT_SHA="$(git -C _upstream rev-parse HEAD)"
            export SLOPKIT_SHA
            export UPSTREAM_DIR="$GITHUB_WORKSPACE/_upstream"
            echo "SlopKit commit: $SLOPKIT_SHA"

            echo "=== Copy full upstream host ==="
            mkdir -p _site
            cp -a _upstream/. _site/
            rm -rf _site/.git

            echo "=== Build custom outer UI and hosted payload files ==="
            export SITE_DIR="$GITHUB_WORKSPACE/_site"
            python jailbreak-host/build_host.py

            echo "=== Add offline cache around fresh original path ==="
            python jailbreak-host/add_offline_cache.py

            echo "=== Validate generated host and upstream identity ==="
            test -f _site/index.html
            test -f _site/original/index.html
            test -f _site/original/slopkit/poops.html
            test -f _site/payload-menu.json
            test -f _site/cache-original-v4.appcache
            test -f _site/.nojekyll
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          upstream = Path('_upstream')
          site = Path('_site')
          original = site / 'original'

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def assert_tree_identical(left, right, label):
              a_files = sorted(p.relative_to(left) for p in left.rglob('*') if p.is_file())
              b_files = sorted(p.relative_to(right) for p in right.rglob('*') if p.is_file())
              if a_files != b_files:
                  raise SystemExit(f'{label} file list differs from upstream')
              for sub in a_files:
                  if sha256(left / sub) != sha256(right / sub):
                      raise SystemExit(f'UPSTREAM MISMATCH: {label}/{sub}')
              print(f'Byte-identical upstream tree: {label} ({len(a_files)} files)')

          # Root copy stays clean, and the fresh /original/ copy must also be exact.
          for rel in ('slopkit', 'offsets', 'ui'):
              assert_tree_identical(upstream / rel, site / rel, rel + '/')
              assert_tree_identical(upstream / rel, original / rel, 'original/' + rel + '/')

          if sha256(upstream / 'index.html') != sha256(original / 'index.html'):
              raise SystemExit('original/index.html differs from upstream')
          if sha256(upstream / 'index.html') != sha256(site / 'original-slopkit.html'):
              raise SystemExit('original-slopkit.html differs from upstream')

          source = json.load(open('payloads-v2.json', encoding='utf-8'))
          menu = json.load(open(site / 'payload-menu.json', encoding='utf-8'))['payloads']
          expected = len(source.get('payloads', [])) + 1
          names = [p['name'] for p in menu]
          if len(menu) != expected:
              raise SystemExit(f'expected {expected} hosted ELFs, got {len(menu)}')
          if names[0] != 'Payload Manager':
              raise SystemExit('Payload Manager is not pinned first')
          if {'fetchpkg', 'pkg_install'}.intersection(names):
              raise SystemExit('removed payload unexpectedly returned')
          if 'ProsperoPlayer' not in names or 'Ghostcontrol' not in names:
              raise SystemExit('required payload missing from hosted catalog')

          manager = menu[0]
          for item in menu:
              p = site / 'payloads' / item['filename']
              if not p.is_file() or p.read_bytes()[:4] != b'\x7fELF':
                  raise SystemExit(f'bad hosted ELF: {p}')

          index = (site / 'index.html').read_text(encoding='utf-8')
          fresh_page = (original / 'slopkit' / 'poops.html').read_text(encoding='utf-8')
          upstream_page = (upstream / 'slopkit' / 'poops.html').read_text(encoding='utf-8')
          manifest = (site / 'cache-original-v4.appcache').read_text(encoding='utf-8')

          fresh_run = 'original/slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17'
          if fresh_run not in index:
              raise SystemExit('custom UI does not use fresh original SlopKit path')
          if fresh_page != upstream_page:
              raise SystemExit('fresh original poops.html differs from upstream')
          if 'manifest=' in fresh_page.split('>', 1)[0]:
              raise SystemExit('fresh SlopKit page was mutated with AppCache')
          if 'const PAYLOAD_MAX_SIZE = 0x200000;' not in fresh_page:
              raise SystemExit('original SlopKit payload limit changed')
          if 'Q.get("autoload")' in fresh_page:
              raise SystemExit('custom autoload logic leaked into original SlopKit')

          if 'manifest="cache-original-v4.appcache"' not in index:
              raise SystemExit('custom root page is not attached to fresh cache')
          if not manifest.startswith('CACHE MANIFEST\n'):
              raise SystemExit('invalid AppCache header')
          if 'original/slopkit/poops.html original/slopkit/poops.html' not in manifest:
              raise SystemExit('fresh original SlopKit fallback is missing')

          cached_payload_lines = [
              line for line in manifest.splitlines()
              if line.startswith('payloads/') and line.lower().endswith('.elf')
          ]
          expected_manager_line = f'payloads/{manager["filename"]}'
          if cached_payload_lines != [expected_manager_line]:
              raise SystemExit(f'offline cache must contain only Payload Manager ELF; got {cached_payload_lines}')

          print(
              f'PASS: /original/ is a byte-for-byte upstream SlopKit copy; '
              f'{len(menu)} hosted ELF files remain outside exploit logic'
          )
          PY

            echo "=== Publish complete static copy to gh-pages ==="
            PUBLISH="$(mktemp -d)"
            cp -a _site/. "$PUBLISH/"
            cd "$PUBLISH"
            git init -q
            git checkout -q -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -Af
            git commit -q -m "Publish PS5 jailbreak host"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin gh-pages
            echo "=== SUCCESS ==="
          ) > jailbreak_host_diagnostics.log 2>&1

          RC=$?
          cat jailbreak_host_diagnostics.log
          echo "$RC" > jailbreak_host_result.txt
          echo "result=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Configure GitHub Pages
        if: steps.host.outputs.result == '0'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.host.outputs.result == '0'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Commit build status and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f jailbreak_host_diagnostics.log jailbreak_host_result.txt
          [ -f jailbreak_host_status.json ] && git add jailbreak_host_status.json
          if git diff --cached --quiet; then
            echo "No diagnostic/status changes."
            exit 0
          fi
          git commit -m "Record jailbreak host build result"
          git pull --rebase origin main
          git push origin main

      - name: Fail job if host publication failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.host.outputs.result }}" = "0"

  deploy-pages:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out repository for status record
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record live Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          build = {}
          p = Path('jailbreak_host_status.json')
          if p.exists():
              build = json.loads(p.read_text(encoding='utf-8'))
          status = {
              'status': 'live',
              'deployed_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'page_url': os.environ['PAGE_URL'],
              'payload_count': build.get('payload_count'),
              'payload_manager_version': build.get('payload_manager_version'),
              'slopkit_commit': build.get('slopkit_commit'),
              'slopkit_runtime_modified': False,
              'fresh_original_path': '/original/',
              'offline_cache': 'fresh-original-slopkit-plus-payload-manager',
              'pages_branch': 'gh-pages',
          }
          Path('jailbreak_pages_status.json').write_text(
              json.dumps(status, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jailbreak_pages_status.json
          if git diff --cached --quiet; then
            echo "Pages status unchanged."
            exit 0
          fi
          git commit -m "Record live jailbreak Pages URL"
          git pull --rebase origin main
          git push origin main
